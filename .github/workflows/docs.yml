name: Build site
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install "zensical==0.1.2"
      - run: zensical build --clean
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: site
          folder: site
          clean: true
          single-commit: true
